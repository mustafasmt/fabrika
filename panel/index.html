<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>kodquiz.console</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='6' fill='%230A0B0F'/><text x='6' y='23' font-family='monospace' font-size='18' fill='%233DDC97'>&gt;_</text></svg>">
<link rel="stylesheet" href="node_modules/@fontsource/inter/400.css">
<link rel="stylesheet" href="node_modules/@fontsource/inter/600.css">
<link rel="stylesheet" href="node_modules/@fontsource/inter/700.css">
<link rel="stylesheet" href="node_modules/@fontsource/jetbrains-mono/400.css">
<link rel="stylesheet" href="node_modules/@fontsource/jetbrains-mono/700.css">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="login" class="login hidden">
  <form id="loginForm" class="login-box">
    <div class="logo">▌kodquiz<span>.console</span></div>
    <div class="mono dim">&gt; auth.login --admin<span class="cursor">▌</span></div>
    <label>e-posta<input type="email" name="email" required autocomplete="username"></label>
    <label>şifre<input type="password" name="password" required autocomplete="current-password"></label>
    <button class="btn primary" type="submit">Giriş yap</button>
    <div id="loginErr" class="err-text"></div>
  </form>
</div>

<div id="app" class="app hidden">
  <aside class="side">
    <div class="logo">▌kodquiz<span>.console</span></div>
    <nav id="nav">
      <a data-view="takvim" class="on"><b>01</b> Takvim</a>
      <a data-view="kuyruk"><b>02</b> Kuyruk</a>
      <a data-view="sorular"><b>03</b> Soru Havuzu</a>
      <a data-view="otopilot"><b>04</b> Otopilot</a>
      <a data-view="loglar"><b>05</b> Loglar</a>
      <a data-view="ayarlar"><b>06</b> Ayarlar</a>
    </nav>
    <div class="side-stats" id="sideStats"></div>
    <button class="btn ghost small" id="logout">çıkış</button>
  </aside>
  <main class="main">
    <div class="query">
      <span class="prompt">&gt;</span>
      <input id="q" spellcheck="false" autocomplete="off" placeholder='paylasimlar where durum = "hazır" and dil = rust'>
      <span class="cursor">▌</span>
      <span class="q-hint mono dim" id="qHint"></span>
    </div>
    <section id="view" class="view"></section>
    <footer class="logbar" id="logbar"></footer>
  </main>
</div>

<div id="modal" class="modal hidden"><div class="modal-box" id="modalBox"></div></div>
<div id="toast" class="toast"></div>

<script src="vendor/supabase.js"></script>
<script src="config.js"></script>
<script type="module" src="app.js"></script>
</body>
</html>
